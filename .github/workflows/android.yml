name: Signed Monster Kart 3D APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monsterkart-release-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'false'
          packages: ''
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot 4.5.2 and Android templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.2
          use-dotnet: false
          include-templates: true

      - name: Import resources and check scripts
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import --quit
          for script in scripts/*.gd; do
            echo "Checking $script"
            godot --headless --path . --check-only --script "$script"
          done

      - name: Smoke test main scene
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 12 > "$RUNNER_TEMP/godot-smoke.log" 2>&1
          cat "$RUNNER_TEMP/godot-smoke.log"
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:' "$RUNNER_TEMP/godot-smoke.log"; then
            echo "::error::Godot game smoke test failed"
            exit 1
          fi

      - name: Configure Godot Android SDK
        run: godot --headless --editor --path . --script tools/configure_android.gd

      - name: Restore existing fixed signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 tools/prepare_signing.py

      - name: Export signed release APK
        if: github.event_name != 'pull_request'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/monsterkart-release.p12
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          test -s "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          godot --headless --path . --export-release Android build/MonsterKart-latest.apk
          test -s build/MonsterKart-latest.apk

      - name: Verify real APK signature
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK="build/MonsterKart-latest.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          SHA="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$SHA"
          echo "SIGNER_SHA256=$SHA" >> "$GITHUB_ENV"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 7
          echo "Signed Monster Kart APK certificate SHA256: $SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release and remove older releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          current="$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "A newer commit exists; skipping stale APK"
            exit 0
          fi
          # Refuse to replace earlier installable builds if signing certificate changed.
          old_sha="$(gh api "repos/$REPO/releases/latest" --jq .body 2>/dev/null |
            sed -n 's/^Signer SHA256: //p' | head -n 1 || true)"
          if [[ -n "$old_sha" && "$old_sha" != "$SIGNER_SHA256" ]]; then
            echo "::error::APK signing certificate does not match the last release"
            exit 1
          fi
          tag="v0.1.$GITHUB_RUN_NUMBER"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" build/MonsterKart-latest.apk \
              --target "$GITHUB_SHA" \
              --title "怪獸甩尾盃 3D · 最新 APK ($tag)" \
              --notes "$(printf '12 monster karts · 3D racing · touch drift · item battles\nSigner SHA256: %s\nCommit: %s' "$SIGNER_SHA256" "$GITHUB_SHA")" \
              --latest
          else
            gh release upload "$tag" build/MonsterKart-latest.apk --clobber
          fi
          names="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          grep -Fxq 'MonsterKart-latest.apk' <<< "$names"
          # Keep the previous release until the new APK has been uploaded and verified.
          gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[].tag_name' |
            while IFS= read -r prior; do
              [[ -z "$prior" || "$prior" == "$tag" ]] && continue
              gh release delete "$prior" --yes --cleanup-tag
            done
          gh release view "$tag" --json url,assets --jq '{url,assets:[.assets[].name]}'
